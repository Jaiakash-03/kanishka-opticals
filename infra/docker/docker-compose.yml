version: '3.8'

services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: kanishka_postgres
    environment:
      POSTGRES_USER: kanishka
      POSTGRES_PASSWORD: kanishka_dev_password
      POSTGRES_DB: kanishka_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanishka -d kanishka_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 for caching & BullMQ
  redis:
    image: redis:7-alpine
    container_name: kanishka_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Meilisearch for full-text product search
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: kanishka_meili
    environment:
      MEILI_MASTER_KEY: 'meili_dev_master_key'
      MEILI_ENV: 'development'
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  meili_data:
